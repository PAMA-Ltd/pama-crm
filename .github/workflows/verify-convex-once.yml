name: Commit Convex Metadata Once

on:
  push:
    branches:
      - feat/convex-backend
    paths:
      - ".github/workflows/verify-convex-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  commit-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Download already-generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/generated
          gh run download 37484870876             --repo "$GITHUB_REPOSITORY"             --name convex-generated-metadata             --dir /tmp/generated

      - name: Commit metadata through GitHub REST API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          BASE_TREE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)"

          create_blob() {
            local file="$1"
            {
              printf '{"content":"'
              base64 -w 0 "$file"
              printf '","encoding":"base64"}'
            } > /tmp/blob.json

            gh api --method POST               "repos/$GITHUB_REPOSITORY/git/blobs"               --input /tmp/blob.json               --jq .sha
          }

          LOCK_SHA="$(create_blob /tmp/generated/package-lock.json)"
          API_DTS_SHA="$(create_blob /tmp/generated/convex/_generated/api.d.ts)"
          API_JS_SHA="$(create_blob /tmp/generated/convex/_generated/api.js)"
          DATA_MODEL_SHA="$(create_blob /tmp/generated/convex/_generated/dataModel.d.ts)"
          SERVER_DTS_SHA="$(create_blob /tmp/generated/convex/_generated/server.d.ts)"
          SERVER_JS_SHA="$(create_blob /tmp/generated/convex/_generated/server.js)"
          CONVEX_TSCONFIG_SHA="$(create_blob /tmp/generated/convex/tsconfig.json)"

          jq -n             --arg base "$BASE_TREE"             --arg lock "$LOCK_SHA"             --arg apiDts "$API_DTS_SHA"             --arg apiJs "$API_JS_SHA"             --arg dataModel "$DATA_MODEL_SHA"             --arg serverDts "$SERVER_DTS_SHA"             --arg serverJs "$SERVER_JS_SHA"             --arg tsconfig "$CONVEX_TSCONFIG_SHA"             '{
              base_tree:$base,
              tree:[
                {path:"package-lock.json",mode:"100644",type:"blob",sha:$lock},
                {path:"convex/_generated/api.d.ts",mode:"100644",type:"blob",sha:$apiDts},
                {path:"convex/_generated/api.js",mode:"100644",type:"blob",sha:$apiJs},
                {path:"convex/_generated/dataModel.d.ts",mode:"100644",type:"blob",sha:$dataModel},
                {path:"convex/_generated/server.d.ts",mode:"100644",type:"blob",sha:$serverDts},
                {path:"convex/_generated/server.js",mode:"100644",type:"blob",sha:$serverJs},
                {path:"convex/tsconfig.json",mode:"100644",type:"blob",sha:$tsconfig},
                {path:".github/workflows/verify-convex-once.yml",mode:"100644",type:"blob",sha:null}
              ]
            }' > /tmp/tree.json

          TREE_SHA="$(gh api --method POST             "repos/$GITHUB_REPOSITORY/git/trees"             --input /tmp/tree.json             --jq .sha)"

          jq -n             --arg message "chore: commit generated Convex metadata"             --arg tree "$TREE_SHA"             --arg parent "$HEAD_SHA"             '{message:$message,tree:$tree,parents:[$parent]}'             > /tmp/commit.json

          COMMIT_SHA="$(gh api --method POST             "repos/$GITHUB_REPOSITORY/git/commits"             --input /tmp/commit.json             --jq .sha)"

          jq -n --arg sha "$COMMIT_SHA" '{sha:$sha,force:false}' |
            gh api --method PATCH               "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"               --input -

          echo "Committed generated metadata at $COMMIT_SHA"
